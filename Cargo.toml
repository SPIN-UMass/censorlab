[package]
name = "censorlab"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitvec = "1.0"
byteorder = "1.4"
clap = { version = "4", features = ["cargo", "derive"] }
coz = "0.1"
# epoll = {version = "4.3" }
fnv = "1.0"
if-addrs = "0.15"
iptables = "0.6"
lalrpop-util = { version = "0.21", features = ["lexer", "unicode"] }
libc = "*"
mac_address = "1.1"
ndarray = "0.17"
nfq = "0.2"
num = "0.4"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["alternative-backend", "ndarray", "std"] }
ort-tract = "0.2"
pcap-parser = "0.16"
procfs = "0.16"
regex = "1.10"
rustpython-vm = { git = "https://github.com/RustPython/RustPython", features = ["jit"], rev = "76236682564d53da2853e45daf9da205628b657f", version = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
smoltcp = { git = "https://github.com/smoltcp-rs/smoltcp", default-features = false, features = ["proto-ipv4", "proto-ipv6", "std", "medium-ethernet", "medium-ip", "phy-raw_socket", "socket-raw"], rev = "a2b92ed6e8d7ae7b1229665c5b3f2e801de111e9", version = "0.11.0" }
thiserror = "2"
tokio = {version="1.40", features=["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"]}
tokio-byteorder = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"] }
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

[build-dependencies]
lalrpop = "0.21"

[features]
default = []
wire = []

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
