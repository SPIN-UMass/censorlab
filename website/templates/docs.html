{% extends "base.html" %}
{% block body_class %}page-light{% endblock %}

{% block content %}
<section class="section docs-section">
  <div class="container docs-container">
    <h1 class="docs-page-title">Documentation</h1>
    <div class="tabs is-centered" id="docs-tabs">
      <ul>
        <li class="is-active" data-tab="general-usage"><a>General Usage</a></li>
        <li data-tab="configuration-reference"><a>Configuration</a></li>
        <li data-tab="pycl-python-censor-language-reference"><a>PyCL (Python)</a></li>
        <li data-tab="censorlang-reference"><a>CensorLang</a></li>
      </ul>
    </div>
    <div class="docs-layout">
      <aside class="docs-toc" aria-label="On this page">
        <p class="docs-toc-title">On this page</p>
        <ul id="docs-toc-list"></ul>
      </aside>
      <div class="docs-content" id="docs-content">
        {{ page.content | safe }}
      </div>
    </div>
  </div>
</section>
{% endblock content %}

{% block scripts %}
<script>
(function() {
  function slugify(text) {
    return text
      .toLowerCase()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/[\s]+/g, '-')
      .replace(/-{2,}/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  // Split the rendered markdown content into tabbed sections by <h1> tags
  var container = document.getElementById('docs-content');
  var children = Array.from(container.childNodes);
  var sections = [];
  var current = null;

  children.forEach(function(node) {
    // Check for h1 elements (our section dividers)
    if (node.nodeType === 1 && node.tagName === 'H1') {
      current = { slug: slugify(node.textContent), title: node.textContent, nodes: [] };
      sections.push(current);
    } else if (current) {
      current.nodes.push(node);
    }
  });

  // Skip the first "CensorLab Reference Documentation" heading — it's the page title.
  // The intro text below it is already represented by the tab bar itself.
  if (sections.length > 0 && sections[0].slug === 'censorlab-reference-documentation') {
    sections.shift();
  }

  // Clear the container and build tab panes
  container.innerHTML = '';
  sections.forEach(function(sec, i) {
    var pane = document.createElement('div');
    pane.className = 'docs-tab-pane' + (i === 0 ? ' is-active' : '');
    pane.id = 'tab-' + sec.slug;
    pane.setAttribute('data-tab', sec.slug);

    // Add the content (skip the <hr> separators between sections)
    sec.nodes.forEach(function(node) {
      if (node.nodeType === 1 && node.tagName === 'HR') return;
      pane.appendChild(node);
    });

    container.appendChild(pane);
  });

  var tabs = document.querySelectorAll('#docs-tabs li');
  var panes = document.querySelectorAll('.docs-tab-pane');
  var tocList = document.getElementById('docs-toc-list');

  // Rebuild the sidebar from the active pane's h2/h3 headings
  function buildToc(pane) {
    tocList.innerHTML = '';
    pane.querySelectorAll('h2, h3').forEach(function(h) {
      var li = document.createElement('li');
      li.className = 'toc-' + h.tagName.toLowerCase();
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      li.appendChild(a);
      tocList.appendChild(li);
    });
  }

  function activateTab(tabSlug, anchor) {
    tabs.forEach(function(tab) {
      tab.classList.toggle('is-active', tab.getAttribute('data-tab') === tabSlug);
    });
    panes.forEach(function(pane) {
      var active = pane.getAttribute('data-tab') === tabSlug;
      pane.classList.toggle('is-active', active);
      if (active) buildToc(pane);
    });
    // Update URL hash without scrolling
    history.replaceState(null, '', '#' + (anchor || tabSlug));
  }

  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      activateTab(tab.getAttribute('data-tab'));
      window.scrollTo({ top: document.getElementById('docs-tabs').offsetTop - 20, behavior: 'smooth' });
    });
  });

  tocList.addEventListener('click', function(e) {
    var a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    var id = a.getAttribute('href').slice(1);
    history.replaceState(null, '', '#' + id);
    document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
  });

  // Highlight the heading currently in view
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      tocList.querySelectorAll('a').forEach(function(a) {
        a.classList.toggle('is-current', a.getAttribute('href') === '#' + entry.target.id);
      });
    });
  }, { rootMargin: '-80px 0px -70% 0px' });
  container.querySelectorAll('h2, h3').forEach(function(h) { observer.observe(h); });

  // Activate tab from URL hash on load: either a tab slug or a heading id (Zola assigns those)
  var hash = decodeURIComponent(window.location.hash.replace('#', ''));
  var target = hash && document.getElementById(hash);
  var targetPane = target && target.closest('.docs-tab-pane');
  if (hash && document.querySelector('#docs-tabs li[data-tab="' + CSS.escape(hash) + '"]')) {
    activateTab(hash);
  } else if (targetPane) {
    activateTab(targetPane.getAttribute('data-tab'), hash);
    target.scrollIntoView();
  } else if (panes.length) {
    buildToc(panes[0]);
  }
})();
</script>
{% endblock %}
