services:
  censorlab:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: censorlab:latest
    ports:
      - "1116:1116"
    # Files under /censorlab/workspace persist on the host across --rm runs
    # (docker/censorlab.sh creates the directory so the host user owns it)
    volumes:
      - ../workspace:/censorlab/workspace
    stdin_open: true
    tty: true

  censorlab-nfq:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: censorlab:latest
    ports:
      - "1116:1116"
    volumes:
      - ../workspace:/censorlab/workspace
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
