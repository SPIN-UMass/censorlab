name: Rust

on:
  push:
    paths:
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      # Integration tests run the demo configs/scripts
      - demos/**
      # The checks are defined in (and evaluated through) the flake
      - flake.nix
      - flake.lock
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - demos/**
      - flake.nix
      - flake.lock
      - .github/workflows/rust.yml

concurrency:
    group: "rust-${{ github.ref }}"
    cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v29
      - name: Nix cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
      # Explicit attributes rather than `nix flake check`, which would also
      # evaluate every dev shell for every system (the experiments shell's
      # suricata doesn't evaluate on darwin).
      # The steps share the crane dependency build, so run them in one job.
      - name: Clippy (all targets, all features, deny warnings)
        run: nix build -L --no-link .#checks.x86_64-linux.clippy
      - name: Tests
        run: nix build -L --no-link .#checks.x86_64-linux.tests
      - name: Tests (--features wire)
        run: nix build -L --no-link .#checks.x86_64-linux.tests-wire
