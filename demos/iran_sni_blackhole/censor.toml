# Iran's SNI filtering: blackholing of the client's packets.
#
# Sources:
#   Bock, Hughey, Merino, Arya, Liscinsky, Pogosian, Levin. "Come as You Are:
#   Helping Unmodified Clients Bypass Censorship with Server-side Evasion."
#   SIGCOMM 2020 (Section 5.2).
#   https://geneva.cs.umd.edu/papers/come-as-you-are.pdf
#   Bock, Bharadwaj, Singh, Levin. "Your Censor is My Censor: Weaponizing
#   Censorship Infrastructure for Availability Attacks." WOOT 2021 (Table I).
#   https://geneva.cs.umd.edu/papers/woot21-weaponizing-availability.pdf
[execution]
mode = "Python"
script = "sni_blackhole.py"

# WOOT 2021, Table I: Iran's SNI censorship null-routes the 4-tuple for 180 s
# and restarts the timer whenever the client sends another packet on it.
# CensorLab forgets a connection (and the script's blackhole flag) once it
# has been idle this long.
[conntrack]
tcp_idle_timeout = 180
