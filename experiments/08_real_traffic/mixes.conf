# Background-traffic mixes for 08_real_traffic (MR4).
#
# NAME=BACKGROUND_PACKETS — how many packets of real traffic (USTC-TFC2016
# benign captures, in fixed file order) are interleaved with each scenario's
# 10 000-packet labelled PCAP.  Same KEY=value grammar as scenario.conf.
#
#   bg0     labelled traffic only (identical to the scenario PCAP)
#   bg10k   ~50 % background
#   bg90k   ~90 % background
#   bg390k  ~97.5 % background (400k packets, ~92 MB)
bg0=0
bg10k=10000
bg90k=90000
bg390k=390000
